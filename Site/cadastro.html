<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Vide+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Logo do site (canto superior esquerdo) -->
    <img class="logo" src="logo.png" alt="Logo Vide+">

    <main class="caixa">

        <h1>Cadastro</h1>
        <p class="subtitulo">Crie sua conta no Vide+</p>

        <form action="#" method="post">

            <!-- Nome -->
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <!-- Data de nascimento -->
            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>

            <!-- E-mail -->
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

            <!-- Senha (será usada no login) -->
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="6" required>

            <button type="submit">Cadastrar</button>

        </form>

        <div class="links">
            <p>
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </div>

    </main>

</body>

</html>
