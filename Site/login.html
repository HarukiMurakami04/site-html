<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configuração dos caracteres -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Login - Vide+</title>

    <!-- Ligação com o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Logo do site (canto superior esquerdo) -->
    <img class="logo" src="logo.png" alt="Logo Vide+">

    <!-- Caixa principal do login -->
    <main class="caixa">

        <h1>Login</h1>
        <p class="subtitulo">Entre na sua conta</p>

        <form action="#" method="post">

            <!-- Campo de login/usuário -->
            <label for="usuario">Login / Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>

            <!-- Campo de senha -->
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <!-- Botão -->
            <button type="submit">Entrar</button>

        </form>

        <!-- Links: recuperar login e criar conta -->
        <div class="links">
            <p><a href="suporte.html">Esqueci meu login / senha</a></p>
            <p>
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>

    </main>

</body>

</html>
