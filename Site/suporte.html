<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Vide+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Logo do site (canto superior esquerdo) -->
    <img class="logo" src="logo.png" alt="Logo Vide+">

    <main class="caixa larga">

        <h1>Suporte</h1>
        <p class="subtitulo">Preencha o formulário abaixo para entrar em contato conosco.</p>

        <form action="#" method="post">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" placeholder="Ex: esqueci minha senha" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

            <button type="submit">Enviar</button>

        </form>

        <hr>

        <!-- Outras formas de contato -->
        <section class="contato">
            <h2>Outras formas de contato</h2>
            <p>E-mail: contato@exemplo.com</p>
            <p>Telefone: (11) 99999-9999</p>
            <p>Endereço: Rua Exemplo, 123 - São Paulo, SP</p>
        </section>

        <!-- Voltar para o login -->
        <div class="links">
            <p><a href="login.html">Voltar ao login</a></p>
        </div>

    </main>

</body>

</html>
